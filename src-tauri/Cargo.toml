[package]
name = "kliky"
version = "0.1.0"
description = "Kliky is a mechanical keyboard sound simulator for macOS and windows."
authors = ["Achuth"]
edition = "2021"
build = "build.rs"

[lib]
name = "kliky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.22.2"
lazy_static = "1.5.0"
rand = { version = "0.10.1", features = ["thread_rng"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-updater = { version = "2.10.1", features = [] }
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
dirs = "6.0"
rusqlite = { version = "0.33.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-log = "2"
log = "0.4"
tokio = { version = "1", features = ["time"] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"


[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
core-graphics = "0.24.0"
core-foundation = "0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
